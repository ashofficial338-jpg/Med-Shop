services:
  # Backend: API only. Serves /api/* and /uploads/*; no static frontend files
  # are built into this service, so server.js's "serve client/dist" block is
  # simply skipped at runtime.
  - type: web
    name: med-shop-api
    env: node
    plan: free
    buildCommand: npm install --prefix server
    startCommand: node server/src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: ADMIN_SEED_EMAIL
        sync: false
      - key: ADMIN_SEED_PASSWORD
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Restricts CORS to the frontend below. Render service URLs are
      # "https://<name>.onrender.com" - update this if you rename the
      # med-shop-web service or add a custom domain.
      - key: CORS_ORIGIN
        value: https://med-backend-1-g2db.onrender.com

  # NOTE ON THE LIVE DEPLOY: the backend actually in production was deployed
  # from its own repo (github.com/ashofficial338-jpg/med-backend), not this
  # blueprint, and Render assigned it https://med-backend-1-g2db.onrender.com
  # (the plain "med-backend" name was taken). This file's service names are
  # for a from-scratch single-repo deploy; on the live med-backend service,
  # set CORS_ORIGIN directly in the Render dashboard once the frontend's
  # real URL is known.

  # Frontend: static build of the React app. Talks to the API above over
  # VITE_API_URL, which Vite bakes into the build at build time (this is why
  # it's set here rather than read at runtime).
  - type: web
    name: med-shop-web
    env: static
    buildCommand: npm install --prefix client && npm run build --prefix client
    staticPublishPath: client/dist
    envVars:
      - key: VITE_API_URL
        value: https://med-shop-api.onrender.com/api
    routes:
      # Client-side routing (React Router) - unmatched paths fall back to
      # index.html instead of 404ing.
      - type: rewrite
        source: /*
        destination: /index.html
